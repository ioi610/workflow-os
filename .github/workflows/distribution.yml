name: Build application downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match package.json, e.g. 0.2.0)"
        required: true
        default: "0.2.0"

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify standalone application
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Check release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable semantic version.');
          if (process.env.REQUESTED_VERSION && process.env.REQUESTED_VERSION !== version) throw new Error('Input version must match package.json.');
          if (process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_REF !== `refs/tags/v${version}`) throw new Error('Tag must match package.json.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          NODE
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm run desktop:test
      - run: npm run build:local
      - run: node --test scripts/*.test.mjs
      - run: node scripts/build-site.mjs
      - run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-output
      - run: npm run desktop:prepare
      - run: npm run desktop:check-build

  desktop:
    name: Desktop / ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            args: "--win --x64"
          - name: macOS-arm64
            os: macos-15
            args: "--mac --arm64"
          - name: macOS-x64
            os: macos-15-intel
            args: "--mac --x64"
          - name: Linux-x64
            os: ubuntu-24.04
            args: "--linux --x64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run desktop:pack -- ${{ matrix.args }}
      - run: npm run desktop:check-build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          path: |
            release/WorkFlow-OS-*.exe
            release/WorkFlow-OS-*.dmg
            release/WorkFlow-OS-*.zip
            release/WorkFlow-OS-*.AppImage
            release/WorkFlow-OS-*.tar.gz

  android:
    name: Android / signed APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build:local
      - run: npm --prefix frontend run android:sync
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          key = os.environ.get('KEYSTORE_BASE64', '')
          if not key: raise SystemExit('Android signing key has not been configured.')
          target = Path(os.environ['RUNNER_TEMP']) / 'workflow-os-release.keystore'
          target.write_bytes(base64.b64decode(key, validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={target}\n')
          PY
      - name: Build and verify signed release
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p ../../release
          cp app/build/outputs/apk/release/app-release.apk ../../release/WorkFlow-OS-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-Android
          path: release/WorkFlow-OS-Android.apk
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

  publish_release:
    name: Publish verified downloads
    needs: [verify, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          merge-multiple: true
          path: release-assets
      - name: Include both animated demonstrations
        run: cp docs/demo/workflow-os-demo.gif docs/demo/workflow-os-mobile-demo.gif release-assets/
      - name: Add SHA-256 checksums
        working-directory: release-assets
        run: sha256sum WorkFlow-OS-* workflow-os-*.gif > SHA256SUMS.txt
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$RELEASE_COMMIT" --title "WorkFlow OS $RELEASE_TAG" --notes-file docs/release-notes.md
          fi

  deploy_pages:
    name: Publish downloads and iPhone web app
    needs: [verify, publish_release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
