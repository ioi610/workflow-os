services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/workflow
      DATABASE_USER: workflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      WORKFLOW_PERSONAL_MODE: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/.data
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
volumes:
  pgdata:
  media:
